<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图标几何构造底板</title><style>*{box-sizing:border-box}body{font:14px system-ui;margin:0;color:#2f3433;background:#f5f4f7}main{max-width:940px;margin:auto;padding:24px}h1{font-size:22px}p{line-height:1.7}a{color:#28634b;display:inline-block;padding:10px 12px}a:focus-visible{outline:3px solid #28634b;outline-offset:3px}.construction-section{margin-top:28px}.construction-section h2{font-size:18px}.guide-control{display:inline-flex;gap:8px;align-items:center;margin-bottom:16px;min-height:32px}.guide-control input{accent-color:#28634b}.guide-control input:focus-visible{outline:3px solid #28634b;outline-offset:3px}.construction-canvas{position:relative;width:min(100%,460px);aspect-ratio:1;background:#f8f5fb;margin:0 0 20px}.construction-canvas>svg,#guide-overlay,#guide-overlay svg{position:absolute;inset:0;width:100%;height:100%}#guide-overlay[hidden]{display:none}@media(max-width:400px){main{padding:16px}}</style><main><h1>图标构造网格 · 1024 × 1024</h1><p>基于提供的参考图重建比例，可用于小图标与 App Icon 的几何造型。</p><section class="construction-section"><h2>几何构造底板</h2><p>外框、中心线、对角线、内接圆与圆角矩形。辅助线单独编辑，成品导出仅包含 Artwork。</p><label class="guide-control"><input id="show-guides" type="checkbox" checked>显示构造辅助线</label><div class="construction-canvas"><div id="guide-overlay"><svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="图标构造网格"><g id="keylines" fill="none" stroke="#A3A0AA" stroke-width="4.2667"><path opacity=".55" d="M0 341.3333H1024M341.3333 0V1024M0 512H1024M512 0V1024M0 682.6667H1024M682.6667 0V1024"/><path opacity=".65" d="M0 0 1024 1024M0 1024 1024 0"/><rect width="1024" height="1024"/><ellipse id="keyline-circle" cx="512" cy="512" rx="426.6667" ry="426.6667"/><ellipse id="keyline-inner-circle" cx="512" cy="512" rx="213.3333" ry="213.3333"/><rect id="keyline-square" x="128" y="128" width="768" height="768" rx="85.3333"/><rect id="keyline-portrait" x="170.6667" y="85.3333" width="682.6667" height="853.3333" rx="85.3333"/><rect id="keyline-landscape" x="85.3333" y="170.6667" width="853.3333" height="682.6667" rx="85.3333"/></g></svg></div></div></section><a href="construction.svg" download>下载构造网格 SVG</a><a href="figma.json" download>下载 Figma 可编辑底板</a><p>导入后在 Artwork 中造型。Guides 是锁定的辅助图层；用 icon shape 命令从几何模板创建可参与布尔运算的实心操作数。</p></main><script>document.getElementById('show-guides').onchange=function(){document.getElementById('guide-overlay').hidden=!this.checked};</script></html>
