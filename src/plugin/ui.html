<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Figma Agent</title>
<style>
:root{color-scheme:light dark;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:12px;color:var(--figma-color-text,#202324);background:var(--figma-color-bg,#fafbf9);--muted:var(--figma-color-text-secondary,#616963);--line:var(--figma-color-border,#dce1da);--surface:var(--figma-color-bg-secondary,#f0f3ee);--accent:#286c4a;--on-accent:#fff}
*{box-sizing:border-box}body{margin:0;min-width:240px}button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.55}button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--figma-color-border-brand,#2d855b);outline-offset:3px}header{display:flex;gap:10px;align-items:center;padding:20px 20px 17px;border-bottom:1px solid var(--line)}.mark{width:30px;height:30px;display:grid;place-items:center;border-radius:8px;background:var(--accent);color:white;flex:none}h1{font-size:14px;font-weight:650;margin:0}header p{font-size:11px;color:var(--muted);margin:3px 0 0}main{padding:18px 20px 20px}.status-row{display:flex;align-items:center;gap:8px;margin-bottom:15px;font-weight:600}.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}.dot[data-state="connected"],.dot[data-state="running"]{background:#2e9060}.dot[data-state="error"]{background:#d05143}.dot[data-state="paused"]{background:#c98c31}.document{border:1px solid var(--line);border-radius:9px;padding:12px;margin-bottom:18px}.label{color:var(--muted);font-size:11px;display:block;margin-bottom:6px}.file{font-size:13px;font-weight:600;overflow-wrap:anywhere;line-height:1.5}.page{color:var(--muted);overflow-wrap:anywhere;margin-top:4px;line-height:1.5}p{line-height:1.65;margin:0 0 12px}code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px}.command{background:var(--surface);padding:10px 12px;border-radius:6px;margin-bottom:14px;overflow-wrap:anywhere}label{display:block;font-weight:550;margin-bottom:7px}.pair-row{display:flex;gap:8px}input{min-width:0;flex:1;background:var(--figma-color-bg,#fff);color:inherit;border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:14px;letter-spacing:3px}button{border:1px solid var(--line);border-radius:6px;padding:9px 14px;background:var(--figma-color-bg,#fff);color:inherit;font-weight:550}.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}.hint{color:var(--muted);font-size:11px;margin-top:9px}.error{border-left:3px solid #c95044;background:var(--surface);padding:9px 11px;margin:12px 0;overflow-wrap:anywhere;line-height:1.6}.session{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;overflow-wrap:anywhere;user-select:all;color:var(--muted)}.actions{display:flex;gap:8px;margin-top:13px}.actions button{flex:1}.log-heading{display:flex;align-items:center;justify-content:space-between;margin:20px 0 9px}.log-heading h2{font-size:11px;font-weight:600;margin:0;color:var(--muted)}#activity{list-style:none;padding:0;margin:0;max-height:160px;overflow:auto}#activity li{padding:9px 0;display:grid;grid-template-columns:1fr auto;gap:8px;border-bottom:1px solid var(--line);line-height:1.45;overflow-wrap:anywhere}#activity time{color:var(--muted);font-size:10px;white-space:nowrap}.empty{color:var(--muted);font-size:11px;margin:0}details{margin-top:17px;border-top:1px solid var(--line);padding-top:12px}summary{cursor:pointer;color:var(--muted);font-size:11px}details p{margin-top:9px;font-size:11px;color:var(--muted)}[hidden]{display:none!important}@media(max-width:300px){header{padding:16px 14px}main{padding:16px 14px}.pair-row{flex-wrap:wrap}.pair-row button{width:100%}.pair-row input{width:100%;flex-basis:100%}}@media(prefers-color-scheme:dark){:root{--accent:#448661;--line:var(--figma-color-border,#414742);--muted:var(--figma-color-text-secondary,#b3bcb4);--surface:var(--figma-color-bg-secondary,#2d332e);color:var(--figma-color-text,#edf1eb);background:var(--figma-color-bg,#232824)}input,button{background:var(--figma-color-bg,#232824)}.primary{background:var(--accent)}}
</style>
</head>
<body data-version="__PLUGIN_VERSION__">
<header><div class="mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M3 14.5V3.5H14M3 9H11M10 14.5L14.5 10M10 10H14.5V14.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div><h1>Figma Agent</h1><p>连接本地设计 CLI</p></div></header>
<main>
<div class="status-row" role="status" aria-live="polite"><span class="dot" id="dot"></span><span id="status">未连接</span></div>
<section class="document" aria-label="当前 Figma 文件"><span class="label">当前文件</span><div class="file" id="document">等待 Figma 文档</div><div class="page" id="page">打开设计文件后连接</div></section>
<form id="pair-form">
<p>在项目目录启动 CLI，将终端中的配对码填入下方。</p>
<div class="command"><code>npm start</code></div>
<label for="code">六位配对码</label><div class="pair-row"><input id="code" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="off" placeholder="••••••" required aria-describedby="code-hint"><button class="primary" id="connect" type="submit">连接</button></div>
<p class="hint" id="code-hint">配对码 10 分钟内有效。重新生成：<code>npm run cli -- pair</code></p>
</form>
<div id="error" class="error" role="alert" hidden></div>
<details id="diagnostics" hidden><summary>连接诊断</summary><p id="diagnostic-text" style="overflow-wrap:anywhere;user-select:text"></p></details>
<section id="connected" hidden aria-label="连接控制"><span class="label">CLI 会话 ID</span><div class="session" id="session"></div><p class="hint" id="selection">尚未选择图层</p><div class="actions"><button id="pause" type="button">暂停接收</button><button id="disconnect" type="button">断开连接</button></div></section>
<div class="log-heading"><h2>最近命令</h2></div><p class="empty" id="empty">连接后，agent 的操作会显示在这里。</p><ol id="activity" aria-label="最近命令"></ol>
<details><summary>连接与执行说明</summary><p>连接地址：<code>localhost:38471</code>。保持文件和插件打开。配对后，本机 CLI 可以读写此文件的图层。暂停会等待当前命令结束，再停止接收下一条命令。关闭插件可结束会话。</p></details>
</main>
<script>/*__UI_SCRIPT__*/</script>
</body></html>
